; Read-only EEPROM dumper for Daikin boards with an X41A service port.
; Settings (Wi-Fi, pins) are in include/setup.h.
; Pick one environment: `pio run -e esp32 -t upload` or `pio run -e nodemcu -t upload`.

[env]
framework = arduino
monitor_speed = 115200

[env:esp32]
platform = espressif32
board = esp32dev

[env:nodemcu]
platform = espressif8266
board = nodemcuv2
; OTA: `pio run -e nodemcu -t upload --upload-port <IP>`.
; For USB, change upload_protocol to esptool and use `--upload-port COM3`.
upload_protocol = espota
